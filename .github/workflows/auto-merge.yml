# Gate and squash-merge Claude's PRs once the full suite is green — the same gates
# a human runs locally: `npm test`, `npm run build`, `npm run smoke`, styles lint.
#
# Triggered on PUSH to `claude/*` (not the `pull_request` event): a PR opened by
# GITHUB_TOKEN does NOT emit `pull_request` events, so keying off the push — which
# always fires — is simpler and more reliable than dispatching across workflows.
# `auto-pr.yml` opens the PR on the same push; this workflow gates the commit (a
# few minutes) and by the time gates finish the PR exists, so it finds and merges
# it. No cross-workflow nudge, no reliance on a dropped webhook.
#
# The hourly `schedule` is a backstop for a transient gate flake (re-evaluates every
# open, eligible PR); `workflow_dispatch` re-evaluates on demand (pass a PR number,
# or leave blank to sweep all). A PR that went behind `main` and conflicts (DIRTY) is
# AUTO-HEALED when the only conflict is the append-only changelog: the gate job merges
# `main` in (the `merge=union` driver keeps both sides' entries as whole blocks) and
# pushes the result, then gates + merges as usual. This is the common collision —
# every PR prepends a changelog entry, so the second to land always conflicts there,
# and GitHub reports DIRTY because its mergeability precheck ignores `.gitattributes`
# merge drivers. A DIRTY PR whose conflict touches anything ELSE is left for a human.
# The full gate suite (incl. the changelog data test) runs on the healed tree, so a
# bad heal can never land. The heal is also VERIFIED BEFORE IT IS PUSHED: union can
# silently emit an unclosed entry when both sides insert at the top of the array
# (their hunks share the trailing `  ] },`, which git keeps once as context), so
# `tools/changelog-lint.js` runs between the merge and the push and leaves the branch
# untouched rather than publishing unparseable JS.
#
# Safety: only same-repo, non-draft `claude/*` branches merge; human and fork PRs
# are untouched. Gates run against the PR head (with `main` merged in when a PR was
# auto-healed), so a red change never lands. Uses GITHUB_TOKEN; kicks deploy.yml
# after a merge (a GITHUB_TOKEN merge doesn't re-trigger push-based workflows).

name: Auto-merge Claude PRs

on:
  push:
    branches: ['claude/**']
  schedule:
    # Hourly backstop for gate flakes (best-effort cron; may coalesce/delay). The
    # push fast path covers latency, so eventual pickup is all this needs to do.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate (blank = sweep all open claude/* PRs)
        required: false
        type: string

# Least-privilege: read the repo + merge the PR, and dispatch the deploy workflow.
permissions:
  contents: write
  pull-requests: write
  actions: write

# Per-branch on push (a newer push supersedes its own in-flight gate); one shared
# 'sweep' group for schedule/dispatch. Never cancel a sweep mid-merge.
concurrency:
  group: automerge-${{ github.event_name == 'push' && github.ref_name || 'sweep' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # Cheap job: resolve which PR numbers this run should evaluate, as a JSON array the
  # merge job fans out over. An empty array skips the merge job, so an idle sweep
  # costs only this ~seconds-long step.
  discover:
    runs-on: ubuntu-latest
    # A branch-deletion push (the tail of every `--delete-branch` merge) carries no
    # commits and no PR to act on — skip it so we don't spin the retry loop.
    if: github.event_name != 'push' || github.event.deleted != true
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Compute the set of PRs to evaluate
        id: list
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            BRANCH='${{ github.ref_name }}'
            # auto-pr.yml opens the PR on this same push; give it up to ~30s to appear.
            CANDIDATES=""
            for _ in $(seq 1 6); do
              CANDIDATES=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
                --json number --jq '.[].number')
              [ -n "$CANDIDATES" ] && break
              sleep 5
            done
            [ -z "$CANDIDATES" ] && echo "No open PR for '$BRANCH' yet — nothing to merge (auto-pr.yml opens it; an hourly sweep also backstops)."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.pr }}" ]; then
            CANDIDATES='${{ github.event.inputs.pr }}'
          else
            # schedule, or a blank-`pr` dispatch: sweep every open PR.
            CANDIDATES=$(gh pr list --repo "$REPO" --state open --limit 50 --json number --jq '.[].number')
          fi

          # Keep only PRs that pass the safety guard: open, non-draft, same-repo,
          # `claude/*` head. (Re-checked authoritatively in the merge job too.)
          ELIGIBLE=()
          for NUM in $CANDIDATES; do
            DATA=$(gh pr view "$NUM" --repo "$REPO" \
              --json headRefName,isCrossRepository,isDraft,state 2>/dev/null) || continue
            STATE=$(jq -r .state <<<"$DATA")
            CROSS=$(jq -r .isCrossRepository <<<"$DATA")
            DRAFT=$(jq -r .isDraft <<<"$DATA")
            HEAD_REF=$(jq -r .headRefName <<<"$DATA")
            if [ "$STATE" = "OPEN" ] && [ "$CROSS" = "false" ] && [ "$DRAFT" = "false" ] \
               && [ "${HEAD_REF#claude/}" != "$HEAD_REF" ]; then
              ELIGIBLE+=("$NUM")
            fi
          done

          PRS=$(printf '%s\n' "${ELIGIBLE[@]:-}" | jq -R 'select(length>0) | tonumber' | jq -sc .)
          echo "Eligible PRs: $PRS"
          echo "prs=$PRS" >> "$GITHUB_OUTPUT"

  # Fan out over the discovered PRs, one at a time (max-parallel: 1 keeps two merges
  # from racing the same base). fail-fast: false so one PR's failure never blocks the
  # rest of the backlog.
  gate-and-merge:
    needs: discover
    if: needs.discover.outputs.prs != '' && needs.discover.outputs.prs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pr: ${{ fromJson(needs.discover.outputs.prs) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Re-resolve PR; classify eligibility and conflict state
        id: pr
        run: |
          set -euo pipefail
          NUM='${{ matrix.pr }}'
          DATA=$(gh pr view "$NUM" --repo "$REPO" \
            --json headRefName,isCrossRepository,isDraft,state,mergeStateStatus)
          STATE=$(jq -r .state <<<"$DATA")
          CROSS=$(jq -r .isCrossRepository <<<"$DATA")
          DRAFT=$(jq -r .isDraft <<<"$DATA")
          HEAD_REF=$(jq -r .headRefName <<<"$DATA")
          MERGE=$(jq -r .mergeStateStatus <<<"$DATA")
          if [ "$STATE" != "OPEN" ] || [ "$CROSS" != "false" ] || [ "$DRAFT" != "false" ] \
             || [ "${HEAD_REF#claude/}" = "$HEAD_REF" ]; then
            echo "PR #$NUM is not an open, non-draft, same-repo claude/* branch — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "number=$NUM" >> "$GITHUB_OUTPUT"
            echo "headRef=$HEAD_REF" >> "$GITHUB_OUTPUT"
            if [ "$MERGE" = "DIRTY" ]; then
              echo "PR #$NUM is DIRTY — will attempt a changelog-only auto-heal before gating."
              echo "dirty=true" >> "$GITHUB_OUTPUT"
            else
              echo "Evaluating PR #$NUM ($HEAD_REF, mergeStateStatus=$MERGE)."
            fi
          fi

      - name: Check out PR branch
        if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          # The branch BY NAME (not refs/pull/N/head) so the auto-heal step can push
          # the merged result back. Fork PRs are filtered out above, so the branch tip
          # is the PR head. Full history is needed to merge `main` in.
          ref: ${{ steps.pr.outputs.headRef }}
          fetch-depth: 0

      - name: Auto-heal a changelog-only conflict
        id: heal
        if: steps.pr.outputs.skip != 'true'
        env:
          DIRTY: ${{ steps.pr.outputs.dirty }}
          HEAD_REF: ${{ steps.pr.outputs.headRef }}
          NUM: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          if [ "${DIRTY:-}" != "true" ]; then
            echo "PR #$NUM is not DIRTY — no heal needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          # Force the union driver for the changelog even on branches cut before it was
          # added to the tracked .gitattributes — .git/info/attributes applies locally,
          # regardless of what the branch has committed.
          echo 'src/data/changelog.js merge=union' >> "$(git rev-parse --git-dir)/info/attributes"
          # A single 3-way merge of `main`: union keeps BOTH sides' changelog entries as
          # whole blocks (valid), unlike a per-commit rebase whose stale context can
          # interleave them. If anything OUTSIDE the changelog conflicts, the merge
          # fails — that is a real conflict, so leave the PR for a human.
          if git merge --no-edit FETCH_HEAD; then
            echo "Merged main cleanly; any changelog collision was resolved by the union driver."
            # VERIFY BEFORE PUBLISHING. A clean `git merge` exit does NOT mean the
            # union driver produced valid JS: when both sides insert at the TOP of
            # the array, their hunks end on the identical `  ] },`, git treats that
            # as shared trailing CONTEXT, and union emits it once — leaving one
            # entry's object literal unclosed. That shipped twice on 2026-08-01
            # (#747 and #749 landing beside an in-flight PR), each time pushed
            # before a single gate ran. changelog-lint is dependency-free so it
            # works here, before `npm ci`.
            if ! node tools/changelog-lint.js; then
              echo "::error::Auto-heal produced an INVALID changelog for PR #$NUM (merge=union collapse). Nothing was pushed — the branch is untouched. Merge main in locally, restore the mangled entry, and push."
              git merge --abort 2>/dev/null || git reset --hard HEAD@{1}
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git push origin "HEAD:refs/heads/$HEAD_REF"
          else
            echo "A conflict remains outside the changelog — leaving PR #$NUM for a human."
            git merge --abort
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.pr.outputs.skip != 'true' && steps.heal.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          # Match deploy.yml (Node 20) so gates run as the bundle ships.
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.pr.outputs.skip != 'true' && steps.heal.outputs.skip != 'true'
        run: npm ci

      - name: Install Chromium for smoke tests
        if: steps.pr.outputs.skip != 'true' && steps.heal.outputs.skip != 'true'
        # The smoke suite boots the game in real Chromium via Playwright.
        run: npx playwright install --with-deps chromium

      - name: Unit + characterization tests
        if: steps.pr.outputs.skip != 'true' && steps.heal.outputs.skip != 'true'
        run: npm test

      - name: Build static bundle
        if: steps.pr.outputs.skip != 'true' && steps.heal.outputs.skip != 'true'
        run: npm run build

      - name: Smoke test (boots the game end-to-end)
        if: steps.pr.outputs.skip != 'true' && steps.heal.outputs.skip != 'true'
        run: npm run smoke

      - name: Styles lint
        if: steps.pr.outputs.skip != 'true' && steps.heal.outputs.skip != 'true'
        run: node tools/styles-lint.js

      - name: Squash-merge and delete branch
        if: steps.pr.outputs.skip != 'true' && steps.heal.outputs.skip != 'true'
        run: |
          set -uo pipefail
          NUM='${{ steps.pr.outputs.number }}'
          # After an auto-heal push, GitHub's mergeability can take a moment to
          # recompute — retry a few times before giving up.
          for i in 1 2 3 4 5; do
            if gh pr merge "$NUM" --repo "$REPO" --squash --delete-branch; then
              exit 0
            fi
            echo "Merge attempt $i for PR #$NUM failed (mergeability may still be propagating); retrying…"
            sleep $((i * 6))
          done
          echo "::error::Could not squash-merge PR #$NUM after retries."
          exit 1

      - name: Trigger Pages deploy
        if: steps.pr.outputs.skip != 'true' && steps.heal.outputs.skip != 'true'
        # A GITHUB_TOKEN merge does not re-trigger deploy.yml's push event, so kick
        # it explicitly. Non-fatal: the merge already succeeded by here.
        run: |
          gh workflow run deploy.yml --repo "$REPO" --ref main \
            || echo "::warning::Could not dispatch deploy.yml; deploy main manually if needed."
