# Open a pull request for every pushed `claude/*` branch, so a build session's job
# ends at "push" — the model never has to open a PR itself. `auto-merge.yml` then
# gates the same push and squash-merges once green.
#
# Idempotent: a branch that already has an open PR is left alone (GitHub updates it
# in place on the next push). Only same-repo `claude/*` branches are ever touched.
#
# Token: the built-in GITHUB_TOKEN. Requires Settings → Actions → General → "Allow
# GitHub Actions to create and approve pull requests" = ON (the create step turns
# the 403 into a clear error otherwise). Set an AUTO_PR_TOKEN secret (a PAT with
# `repo` scope) to bypass that setting.

name: Auto-open Claude PRs

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:
    inputs:
      branch:
        description: claude/* branch to open a PR for
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

# One run per branch; never cancel mid-create (a duplicate PR is worse than a wait).
concurrency:
  group: autopr-${{ github.event_name == 'push' && github.ref_name || github.event.inputs.branch }}
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.AUTO_PR_TOKEN || secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.branch }}
    steps:
      # Checkout-free: title/body and the ahead-of-main check come from the API, so
      # this job stays a few seconds — no full-history clone.
      - name: Open PR into main if the branch is ahead and none is open
        run: |
          set -euo pipefail
          case "$BRANCH" in
            claude/*) ;;
            *) echo "Branch '$BRANCH' is not a claude/* branch — nothing to do."; exit 0 ;;
          esac

          # Already open? Pushes update it in place — done.
          EXISTING=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open for '$BRANCH'."
            exit 0
          fi

          # Nothing to propose if the branch isn't ahead of main.
          AHEAD=$(gh api "repos/$REPO/compare/main...$BRANCH" --jq '.ahead_by' 2>/dev/null || echo 0)
          if [ "${AHEAD:-0}" -eq 0 ]; then
            echo "Branch '$BRANCH' has no commits ahead of main — no PR to open."
            exit 0
          fi

          # Title = tip commit subject; body = its message body + a provenance line.
          MSG=$(gh api "repos/$REPO/commits/$BRANCH" --jq '.commit.message')
          TITLE=$(printf '%s\n' "$MSG" | head -1)
          {
            printf '%s\n' "$MSG" | tail -n +3
            printf '\n---\nOpened automatically by `auto-pr.yml`. `auto-merge.yml` squash-merges once the gate suite is green.\n'
          } > /tmp/pr-body.md

          set +e
          URL=$(gh pr create --repo "$REPO" --base main --head "$BRANCH" \
            --title "$TITLE" --body-file /tmp/pr-body.md 2>/tmp/pr-err)
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            if grep -qi 'not permitted to create or approve pull requests' /tmp/pr-err; then
              echo "::error::GitHub Actions can't create PRs. Turn ON Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests', or add an AUTO_PR_TOKEN secret (PAT with repo scope)."
            fi
            cat /tmp/pr-err >&2
            exit "$RC"
          fi
          echo "Opened $URL"
